[project]
name = "banyan-backend"
version = "0.1.0"
description = "Banyan backend: agents that grow their own tools, with humans as gatekeepers"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "sqlmodel>=0.0.22",
    "pydantic-settings>=2.4",
    "python-dotenv>=1.0",
    "psycopg[binary]>=3.2",
    "openai-agents>=0.24.0",
    "httpx>=0.28.1",
    "bandit>=1.9.4",
    "cryptography>=50.0.2",
]

[dependency-groups]
dev = ["pytest>=8", "httpx>=0.27"]

[tool.uv]
package = false
